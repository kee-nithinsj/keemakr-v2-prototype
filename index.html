<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kee</title>
    <link rel="preload" href="/fonts/lato-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lato-500.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Set the theme before first paint so a light-theme user never sees a dark flash. -->
    <script>
      var theme = 'dark';
      try {
        theme =
          new URLSearchParams(location.search).get('theme') ||
          localStorage.getItem('kee-theme') ||
          'dark';
      } catch (_) {}
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.toggle('dark', theme !== 'light');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
